name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Build app bundle
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee build.log || {
            # Surface compiler diagnostics as annotations
            grep -E ':[0-9]+:[0-9]+: error:' build.log | sort -u | head -50 | \
              sed -E "s#^${GITHUB_WORKSPACE}/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#"
            grep -vE ':[0-9]+:[0-9]+: (error|warning|note):' build.log | grep -iE 'error|fatal' | sort -u | head -15 | sed 's/^/::error::/'
            exit 1
          }

      - name: Zip
        run: cd build && ditto -c -k --keepParent SourceMix.app SourceMix.zip

      - uses: actions/upload-artifact@v5
        with:
          name: SourceMix
          path: build/SourceMix.zip
